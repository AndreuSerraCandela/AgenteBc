[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-bc"
version = "0.1.0"
description = "Asistente de diagnóstico de errores de Business Central on-premises"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1,<4",
    "playwright>=1.55,<2",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
sql = ["pyodbc>=5.2,<6"]
windows-auth = ["requests-negotiate-sspi>=0.5.2,<1"]
dev = ["pytest>=8.3,<9"]

[project.scripts]
agentebc = "agentebc.cli:main"
agentebc-web = "agentebc.webapp:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentebc = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
